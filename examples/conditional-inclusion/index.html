<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jam Recording Links - Conditional Inclusion</title>
    <!--
      CSP for Jam recording scripts - NOTE: This meta tag is IGNORED by Electron's
      sandbox mode. The actual CSP for Electron is set via session.defaultSession
      in main.ts. This tag is kept for documentation and potential web-only usage.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' http://localhost:* https://localhost:*; script-src 'self' 'unsafe-inline' 'unsafe-eval' http://localhost:* https://localhost:* https://*.jam.dev https://*.jam.test:*; connect-src 'self' http://localhost:* https://localhost:* https://*.jam.dev https://*.jam.test:* wss://*.jam.dev wss://*.jam.test:*; style-src 'self' 'unsafe-inline' http://localhost:* https://localhost:*; img-src 'self' data: http://localhost:* https://localhost:* https://*.jam.dev https://*.jam.test:*; font-src 'self' data: http://localhost:* https://localhost:*; frame-src 'self' https://*.jam.dev https://*.jam.test:*;">
    <link rel="stylesheet" href="/src/style.css" />

    <meta name="jam:team" content="f5f89d61-4a4c-4d85-afe1-e5acafd558b5" />
    <meta name="jam:team" content="87cdf305-4dfc-4070-a2a8-fd3a7b582097" />
    <meta name="jam:team" content="634eaf31-20c9-0300-2638-3fa158294736" />
    <meta name="jam:blur" content="form" />
  </head>
  <body>
    <ul>
      <li data-script-block="recorder">
        <strong data-private>Is recorder.js loaded?</strong>
        <span data-script-loaded="no">No</span>
      </li>
      <li data-script-block="capture">
        <strong>Is capture.js loaded?</strong>
        <span data-script-loaded="no">No</span>
      </li>
    </ul>
    <div>
      <button data-jam-blur type="button" data-script-loader="recorder">
        Load recorder.js
      </button>
    </div>
    <form>
      <label>
        <strong data-private data-jam-blur="no">Recording ID:</strong>
        <input name="recordingId" placeholder="verify" />
      </label>
      <button type="submit">Open recorder</button>
    </form>
    <script>
      // Auto-forward to Electron app if protocol handler is installed
      //
      // NOTE: This is a simplified approach for demo purposes only.
      // In a production app, you should:
      // 1. Detect if the app is installed before attempting redirect
      // 2. Provide fallback UI with download links if app not installed
      // 3. Handle the case where protocol launch fails gracefully
      // 4. Consider user privacy - don't auto-launch without user consent
      // 5. Prevent infinite redirects if app fails to launch
      (function() {
        // Skip if already in Electron (check user agent)
        if (navigator.userAgent.includes('Electron')) return;

        // Attempt to open in Electron app via protocol handler
        window.location.href = 'jam-electron-demo://open' + window.location.search + window.location.hash;
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
