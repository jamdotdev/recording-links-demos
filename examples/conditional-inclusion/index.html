<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jam Recording Links - Conditional Inclusion</title>
    <!-- CSP to allow Jam recording scripts in Electron sandbox -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' http://localhost:* https://localhost:*; script-src 'self' 'unsafe-inline' 'unsafe-eval' http://localhost:* https://localhost:* https://*.jam.dev https://*.jam.test:*; connect-src 'self' http://localhost:* https://localhost:* https://*.jam.dev https://*.jam.test:* wss://*.jam.dev wss://*.jam.test:*; style-src 'self' 'unsafe-inline' http://localhost:* https://localhost:*; img-src 'self' data: http://localhost:* https://localhost:* https://*.jam.dev https://*.jam.test:*; font-src 'self' data: http://localhost:* https://localhost:*; frame-src 'self' https://*.jam.dev https://*.jam.test:*;">
    <link rel="stylesheet" href="/src/style.css" />

    <meta name="jam:team" content="f5f89d61-4a4c-4d85-afe1-e5acafd558b5" />
    <meta name="jam:team" content="87cdf305-4dfc-4070-a2a8-fd3a7b582097" />
    <meta name="jam:team" content="634eaf31-20c9-0300-2638-3fa158294736" />
    <meta name="jam:blur" content="form" />
  </head>
  <body>
    <ul>
      <li data-script-block="recorder">
        <strong data-private>Is recorder.js loaded?</strong>
        <span data-script-loaded="no">No</span>
      </li>
      <li data-script-block="capture">
        <strong>Is capture.js loaded?</strong>
        <span data-script-loaded="no">No</span>
      </li>
    </ul>
    <div>
      <button data-jam-blur type="button" data-script-loader="recorder">
        Load recorder.js
      </button>
    </div>
    <form>
      <label>
        <strong data-private data-jam-blur="no">Recording ID:</strong>
        <input name="recordingId" placeholder="verify" />
      </label>
      <button type="submit">Open recorder</button>
    </form>
    <script>
      // Auto-forward detection for Electron app
      (function() {
        // Check if we're already in Electron (via the preload script API)
        if (window.electronAPI && window.electronAPI.isElectron) {
          console.log('Already running in Electron app');
          return;
        }

        // Check if current URL has jam-* parameters (means we're in recorder window)
        const params = new URLSearchParams(window.location.search);
        const hasJamParams = Array.from(params.keys()).some(key => key.startsWith('jam-'));
        if (hasJamParams) {
          console.log('Page has jam parameters - already in recorder context, skipping forward');
          return;
        }

        // Try to detect and launch the Electron app
        const protocolUrl = 'jam-electron-demo://open' + window.location.search + window.location.hash;

        console.log('Attempting to forward to Electron app:', protocolUrl);

        // Method 1: Try to navigate to the protocol URL
        const attemptLaunch = () => {
          const iframe = document.createElement('iframe');
          iframe.style.display = 'none';
          iframe.src = protocolUrl;
          document.body.appendChild(iframe);

          // Clean up the iframe after a short delay
          setTimeout(() => {
            document.body.removeChild(iframe);
          }, 2000);
        };

        // Method 2: Also try window.location for better compatibility
        // Use iframe method as it's less disruptive
        attemptLaunch();
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
